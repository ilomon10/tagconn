# tagconn server configuration.
#
# This file is one layer in the settings stack:
#   schema defaults (packages/shared/src/settings.ts)
#     -> this file (path from env OFFICE_CONFIG, default ./config/office.yaml)
#     -> env vars OFFICE_<SECTION>__<KEY_SNAKE> (+ shortcut OFFICE_HOOK_TOKEN)
#     -> runtime overrides saved in SQLite (edited from the web GUI)
#
# Every value below is commented out and shown at its in-code default, so
# this file works unmodified. Uncomment and edit only what you want to
# override; everything else keeps its default. Keys marked "restart
# required" only take effect after the server process restarts (see
# RESTART_REQUIRED_SETTINGS in packages/shared/src/settings.ts).

server: {}
  # host: "127.0.0.1"                   # restart required. Docker sets 0.0.0.0
  #                                       # internally via OFFICE_SERVER__HOST env
  #                                       # (docker-compose.yml); the published
  #                                       # port still binds 127.0.0.1 on the host.
  # port: 4317                          # restart required. env: OFFICE_SERVER__PORT
  # corsOrigins:                        # restart required
  #   - "http://localhost:4318"
  #   - "http://127.0.0.1:4318"
  #   - "http://localhost:5173"
  # Accepted Host header hostnames (port ignored); requests with any other
  # Host are rejected. Blocks DNS-rebinding attacks. "server" is the
  # docker-compose service name nginx proxies to internally.
  # allowedHosts:
  #   - "localhost"
  #   - "127.0.0.1"
  #   - "[::1]"
  #   - "server"
  # Shared secret the hook sends as `x-office-token`. Empty = no auth
  # (fine for local-only use). Prefer the OFFICE_HOOK_TOKEN env shortcut,
  # or let `pnpm office:install` generate and wire one up for you, over
  # committing a real token to this file. `office:install` writes the same
  # token into ~/.config/tagconn/curl.conf (mode 600) for the hook script.
  # hookToken: ""                       # env shortcut: OFFICE_HOOK_TOKEN
  # logLevel: "info"                    # fatal | error | warn | info | debug | trace
  #
  # The entire `server` section, `storage.dbPath`, `paths`,
  # `runner.permissionMode` and `runner.allowedProjectDirs` can only be set
  # here or via env - never from the web GUI (see GUI_IMMUTABLE_SETTINGS in
  # packages/shared/src/settings.ts).

storage: {}
  # dbPath: "./data/office.db"          # restart required. env: OFFICE_STORAGE__DB_PATH
  # eventRetentionDays: 14
  # snapshotEventLimit: 200

ingest: {}
  # enabledEvents:
  #   - SessionStart
  #   - SessionEnd
  #   - UserPromptSubmit
  #   - PreToolUse
  #   - PostToolUse
  #   - PostToolUseFailure
  #   - SubagentStart
  #   - SubagentStop
  #   - Stop
  #   - Notification
  #   - PreCompact
  # Regexes (compiled with flags "gi"); matches in tool input/response text
  # become "[redacted]" before storage/broadcast.
  # redactPatterns:
  #   - '(api[_-]?key|secret|token|password|passwd|authorization)["\s:=]+[^\s"'',]+'
  #   - 'sk-[A-Za-z0-9_-]{20,}'
  #   - 'gh[pousr]_[A-Za-z0-9]{20,}'
  # storeToolPayloads: false
  # maxPayloadBytes: 1048576

paths: {}
  # claudeDir: "~/.claude"
  # agentsDir: "~/.claude/agents"       # restart required. env: OFFICE_PATHS__AGENTS_DIR
  #                                       # (docker: /claude/agents)
  # projectsDir: "~/.claude/projects"   # restart required. env: OFFICE_PATHS__PROJECTS_DIR
  #                                       # (docker: /claude/projects)

agents: {}
  # doneLingerSec: 20     # seconds a finished subagent lingers before it despawns
  # idleAfterSec: 90      # seconds without events before an active agent looks idle
  # typeToRole:            # map Claude agent_type -> role name when they differ
  #   general-purpose: developer
  #   Explore: analyst
  #   Plan: architect

heroes: {}
  # Named, persistent hero identities bound to live agents (M8 8i). Off = anonymous
  # characters (pre-M8 look). See docs/design/living-office.md section 3.
  # enabled: true
  # maxPerRole: 6          # heroes per (project, role); further subagents draw anonymously
  # maxPerProject: 40
  # reuseIdleAfterSec: 600 # a new subagent may take over a live subagent's hero once it has
  #                         # been idle this long; 0 = never take over a live agent's hero
  # namePools:              # role (or "default") -> names for new heroes; replaced wholesale
  #   pm: [Aldric, Seraphine, ...]           # see DEFAULT_HERO_NAME_POOLS in
  #   developer: [Brom, Tamsin, ...]         # packages/shared/src/heroes.ts for the full
  #   default: [Rook, Ember, ...]            # shipped list (one pool per built-in role)

progression: {}
  # M14 hero levels from tokens spent (docs/design/battles.md).
  # enabled: true
  # xpWeights:                # 0..10 XP per token kind
  #   output: 1
  #   input: 0.2
  #   cacheCreation: 0.1
  #   cacheRead: 0            # cache reads excluded so long sessions don't inflate XP
  # levelBase: 1500           # 10..10000000. XP for level L = levelBase * (L-1)^levelExponent
  # levelExponent: 2          # 1..4
  # maxLevel: 50              # 2..100
  # skillPointsPerLevel: 1    # 0..5
  # allowRespec: true
  # anonymousInBattle: true   # anonymous subagents may join a party with a temporary level

battle: {}
  # M14 turn-based battles against encounter NPCs. Cosmetic stakes only.
  # enabled: true
  # offerChance: 0.5          # 0..1. Chance an encounter NPC offers a battle
  # autoIgnoreSec: 20         # 5..300. Prompt counts as Ignore after this
  # maxParty: 4               # 1..4
  # koMinutes: 5              # 0..240. Rest time for a knocked-out hero; 0 = no KO
  # difficulty: 1             # 0.5..2. Enemy level = party average level x difficulty
  # music: true
  # xpScale: 0.5              # 0..10. Win XP = levelBase x enemy level x xpScale
  # skillPointEveryWins: 3    # 0..100. Bonus skill point every N wins; 0 = never
  # lootChance: 0.35          # 0..1
  # maxTurns: 60              # 10..200. Turns before the enemy loses interest (timeout)
  # maxPerHour: 30            # 1..120. Battles that may be started per hour
  # openTtlMin: 30            # 1..240. Minutes an unresolved battle stays open
  # retentionDays: 30         # 1..365. Days finished battles are kept
  # items:                    # consumables each party brings, 0..9 each
  #   coffee: 2
  #   energyDrink: 1
  #   rubberDuck: 1
  #   pizza: 0

activity: {}
  # rules: []   # see DEFAULT_ACTIVITY_RULES in packages/shared/src/settings.ts for
  #             # the full default list (tool/input regex -> activity/zone/bubble).
  #             # Overriding this key replaces the whole list, not just one rule.

office: {}
  # theme: "auto"          # day | night | auto. auto follows office.lighting.cycle
  # walkSpeed: 120
  # maxCharacters: 40
  # showBubbles: true
  # bubbleSeconds: 6
  # zoom: 1
  # sound: false
  # zones: {}              # deprecated since M7 (ignored by the layout renderer; kept for old
  #                         # configs): optional zone rectangle overrides, in tile units:
  #                         # zones: { desks: { x: 0, y: 0, w: 10, h: 6 } }
  # style: "guild"                  # modern | guild. Visual skin; a layout may override it
  #                                  # with its own `style`.
  # defaultLayoutId: "default"       # layout for floors without their own layoutId;
  #                                  # GET/POST/PUT/DELETE /api/layouts
  # floorOrder: "created"            # created | name | recent. Stair order between floors.
  # floorTransitionMs: 600           # 0..3000. Stairs transition duration; 0 = instant.
  # ambientEffects: true             # dust motes, torch flicker, sparkles (guild style)
  # dualGrid: true                   # M15 dual-grid tile edges: real corners and wall outlines.
  #                                  # false = flat per-tile paint (the pre-M15 look).
  # lighting: {}                     # M16 host-time sun cycle and lightmap. Docker: set TZ or the host
  #                                    clock is UTC.
  #   cycle: "host-clock"            #   host-clock | fixed | accelerated
  #   fixedHour: 14                  #   0..24 decimal hour for fixed / accelerated start
  #   cycleMinutes: 24               #   1..1440 real minutes per day (accelerated)
  #   dawnHour: 6.5                  #   0..11 sunrise centre
  #   duskHour: 18.5                 #   13..24 sunset centre
  #   twilightHours: 1.5             #   0.25..4 ramp length
  #   nightAmbient: 0.35             #   0..1 brightness at deep night
  #   lightScale: 1                  #   0.25..3 light reach multiplier
  #   shadows: "cast"                #   off | blob | cast
  #   lightmap: true                 #   occluded lightmap (WebGL high); false = flat overlay
  #   resolution: "half"             #   half | quarter
  #   sunStepMinutes: 15             #   1..120 minutes between re-bakes
  #   windowShafts: true             #   sun/moon shafts in front of windows
  # pmMode: "single"                 # single | per-session (M8 8b). single: one Guild Master
  #                                  # sprite per floor + a session count chip; per-session:
  #                                  # today's behaviour (one sprite per main session).
  # pmSwitchCooldownSec: 15          # min seconds before the Guild Master switches sessions
  #                                  # (a session that needs you switches at once)
  # idleLeaveSec: 300                # seconds a hero with no live agent rests in the tavern
  #                                  # before walking out (M8 8c); 0 = leave at once
  # multiverseMaxRealms: 12          # realms drawn on the Multiverse floor (M8 8h); extra
  #                                  # projects group into one "Other realms" realm
  # multiverseMaxCharacters: 60      # character cap on the Multiverse floor, split fairly
  #                                  # across realms (Guild Masters first)
  # shaders: {}                      # M8 8o WebGL post-processing; M9 monitor screen effects.
  #                                    Ignored on the canvas renderer (WebGL unavailable).
  #   enabled: true
  #   quality: "auto"                # auto | low | high. auto measures frame time for ~2s.
  #   bloom: 0.45                    # 0..1. Glow around torches, braziers, monitors, windows; 0 = off.
  #   vignette: 0.4                  # 0..1. Darkness at the very screen edge; 0 = off.
  #   vignetteSize: 0.12             # 0.03..0.4. Frame width, fraction of the shorter side; the middle stays clean.
  #   vignetteStyle: "pixel"         # pixel | smooth. pixel: hard stepped bands on a blocky
  #                                    grid (default). smooth: a soft fade along the edges.
  #   vignetteSteps: 4               # 2..8. Pixel style shade bands (4 = 25/50/75/100%).
  #   vignettePixel: 4               # 1..16. Pixel style block size, in art pixels; scales
  #                                    with the camera zoom.
  #   grading: true                  # Per-style color grading (warm office, candlelit guild,
  #                                    aurora rift).
  #   lightGlow: true                # Soft animated glow pools under light sources.
  #   screen: "off"                  # off | crt | lcd | vhs. Server default monitor effect;
  #                                    each browser's top bar "Screen" button may override it.
  #   screenStrength: 0.6            # 0..1. Screen effect intensity.
  #   scanlines: false               # Legacy: CRT look on the modern style, used only while
  #                                    `screen` is "off". Prefer `screen: "crt"`.
  # labels: {}                       # M13 RPG name plates above the head.
  #   showTask: "focus"              # focus | always | never. Third line with the task.
  #   taskLines: 2                   # 1..4. Lines the task wraps to.
  #   maxWidthChars: 24              # 8..60. Plate width in name characters.
  #   showTitle: true                # Second line with the themed title.
  #   pixelFont: true                # Code-drawn pixel font (WebGL only).
  # life: {}                         # M13 meetings and idle activities (presentation only).
  #   enabled: true
  #   kickoffWindowSec: 30           # 5..300. 2+ subagents spawning within it start a kickoff.
  #   meetingSec: 20                 # 5..600. How long everyone sits at the table.
  #   standupEverySec: 1800          # 60..86400. Minimum gap between stand-ups.
  #   standupMinCast: 3              # 2..12. Idle characters needed for a stand-up.
  #   idleActivityEverySec: 60       # 10..3600. Average gap between idle activities.
  #   maxConcurrent: 2               # 1..8. Meetings plus activities at once.
  #   maxMeetingSize: 6              # 2..12. Host plus invitees.
  # npcs: {}                         # M13 routine NPCs and random encounters.
  #   enabled: true
  #   janitor: true
  #   encounters: true               # Random visitors; courier and plant waterer stay.
  #   encounterEverySec: 240         # 30..86400. Average gap between NPC visits.
  #   maxConcurrent: 2               # 1..6. NPCs at once (1 on low graphics quality).
  #   allowChaos: true               # Idle characters may flee, gather or chase.
  #   maxReactors: 4                 # 1..8. Idle characters reacting to one NPC.
  #   disabledKinds: []              # janitor | courier | plant-waterer | guest | police |
  #                                  # cia-agent | sales-dog | monster | office-cat
  # alerts: {}                       # M13 JRPG-style alert boxes.
  #   enabled: true
  #   onAsk: true
  #   onDone: true
  #   onFailure: true
  #   perMinute: 4                   # 1..60. Token-bucket refill rate.
  #   burst: 3                       # 1..10. Token-bucket size.
  #   agentCooldownSec: 60           # 0..3600. Per-character cooldown.
  #   autoDismissSec: 8              # 0..120. 0 = until dismissed.
  #   maxVisible: 2                  # 1..5. Boxes on screen at once.
  # audio: {}                        # M13 sound mix; `sound` above stays the master switch.
  #   volume: 0.6                    # 0..1
  #   sfx: true
  #   ambient: true
  #   alerts: true
  #   footsteps: true

notifications: {}
  # onWaiting: true
  # onDone: false
  # onBlocked: true

runner: {}
  # enabled: false
  # maxConcurrent: 3
  # defaultModel: "sonnet"          # opus | sonnet | haiku
  # permissionMode: "acceptEdits"   # default | acceptEdits | plan | bypassPermissions
  # allowedProjectDirs: []
