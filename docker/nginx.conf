# tagconn web: static SPA + reverse proxy to the server for /api and socket.io.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # socket.io upgrade handling: only add the Upgrade header when the client asks for it.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Shared security headers (defined once, referenced from every location below).
  # `add_header` does not inherit into a location that declares its own `add_header`
  # (e.g. the Cache-Control overrides below), so every location must repeat the
  # full set explicitly rather than relying on server-level inheritance.
  #
  # CSP: verified against the built SPA (apps/web/dist) on 2026-09-25.
  #   - script-src/style-src 'self' only: no inline <script>/<style> in index.html, no
  #     JSX <style> elements, and React/Tailwind styles are set via the CSSOM `style`
  #     property (element.style.*), which CSP style-src does not gate.
  #   - Phaser's bundled `new Function("return this")()` globalThis polyfill and its
  #     `setAttribute("style", ...)` DOM-container helper are both dead code in every
  #     evergreen browser (guarded by `typeof globalThis`/unused export), so no
  #     'unsafe-eval' or 'unsafe-inline' is required. See handoff for detail.
  #   - connect-src 'self' covers the same-origin socket.io websocket upgrade; no
  #     ws:/wss: wildcard needed (verified in Chrome and Firefox).
  map $host $csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'";
  }

  map $host $permissions_policy {
    default "camera=(), microphone=(), geolocation=()";
  }

  upstream tagconn_server {
    server server:4317;
  }

  server {
    listen 4318;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy $permissions_policy always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;

      proxy_pass http://tagconn_server;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # More specific than /api/ above: matched first by nginx's longest-prefix rule.
    # Auth responses (tokens, session state) must never be cached.
    location /api/auth/ {
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy $permissions_policy always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cache-Control "no-store" always;

      proxy_pass http://tagconn_server;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy $permissions_policy always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;

      proxy_pass http://tagconn_server;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }

    # SPA fallback: unknown paths resolve to index.html, static assets served
    # directly (and cached - Vite fingerprints them).
    location /assets/ {
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy $permissions_policy always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      # One Cache-Control header (expires would add a second, conflicting one).
      add_header Cache-Control "public, max-age=31536000, immutable" always;

      try_files $uri =404;
    }

    # Matched whether requested directly or reached via the try_files fallback
    # below (an internal redirect to a URI re-enters location matching), so
    # index.html always gets no-store regardless of the original request path.
    location = /index.html {
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy $permissions_policy always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cache-Control "no-store" always;

      try_files $uri =404;
    }

    location / {
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy $permissions_policy always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;

      try_files $uri $uri/ /index.html;
    }
  }
}
