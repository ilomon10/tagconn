# tagconn Desktop: builds the Tauri app (Windows NSIS installer, Linux AppImage + .deb), smoke-tests it, signs the
# updater artifacts, publishes them to the GitHub Release of the tag together with latest.json (the updater
# manifest), and pushes the Docker-mode server image to ghcr.io.
#
# Triggers
#   - push of a tag v*    : build, smoke, sign, publish (a DRAFT release is created if the tag has none yet), push the image
#   - workflow_dispatch   : build + smoke only, artifacts stay on the run. Set `release_tag` to build THAT tag (it is
#                           checked out, not the branch the run was started from) and attach the builds to its release.
#                           Publishing never touches a release that is already published: only a draft (or a new
#                           draft) is uploaded to. To redo a published release, delete or un-publish it by hand.
#
# One-time GitHub setup (Settings of the repository)
#   1. Environment `release` (Settings > Environments > New environment):
#        - Required reviewers: yourself (and anyone else allowed to ship).
#        - Deployment branches and tags: "Selected branches and tags", add a TAG rule `v*` (and no branch rule).
#      The signing job and the publish job run in this environment, so a run started from a branch (workflow_dispatch
#      or a modified workflow file on a branch) can never read the signing key or write a release.
#   2. Tag ruleset (Settings > Rules > Rulesets > New tag ruleset): target tag pattern `v*`, restrict creations,
#      updates and deletions (bypass: the maintainer only), so a release tag cannot be moved or re-created.
#   3. Secrets, stored as ENVIRONMENT secrets of `release` (not repository secrets):
#        TAURI_SIGNING_PRIVATE_KEY           the updater signing key (the CONTENT of the generated key file, not its path)
#        TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the password chosen when generating it (empty is allowed if none was set)
#      Generate the pair once, locally:
#        pnpm --filter @tagconn/desktop tauri signer generate -w ~/.tauri/tagconn.key
#      then store the private key file's content and the password as the two secrets above, and paste the printed
#      PUBLIC key into `plugins.updater.pubkey` of apps/desktop/src-tauri/tauri.bundle.conf.json (and tauri.conf.json).
#   Without the secrets the build and publish still succeed, but there are no .sig files and no latest.json, and the
#   app's "Check for updates" stays disabled. Windows code signing is not configured (SmartScreen: "unknown publisher").
#
# The updater key is NOT in the environment of `tauri build` (which runs third-party build scripts). The installers are
# built with updater artifacts OFF (Tauri 2 refuses to build them without the key), then the `sign` job signs the
# produced installers with `tauri signer sign` (a v2 updater artifact is the installer itself plus its .sig), with the
# key in that one step's env only. Every action is pinned to a full commit SHA (the tag is in the comment); update
# them deliberately. Caches are used for branch runs only; release builds (tag or release_tag) neither restore nor
# save any cache. GITHUB_TOKEN is the only other credential (release upload and ghcr push, scoped per job).
name: desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag (vX.Y.Z) to build and attach to its DRAFT release. Empty = build and smoke only.'
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 24.21.0
  # The strict release tag shape, used by every job that handles a tag (grep -E).
  TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            sidecar: tagconn-node-x86_64-pc-windows-msvc.exe
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            sidecar: tagconn-node-x86_64-unknown-linux-gnu
    env:
      # A release build: a tag push, or a dispatch that names a tag. Those never use a cache.
      RELEASE_BUILD: ${{ (github.ref_type == 'tag' || inputs.release_tag != '') && 'true' || 'false' }}
    steps:
      # In dispatch mode the requested tag is what gets built (never the branch the run started from).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Check the tag matches the app version
        if: env.RELEASE_BUILD == 'true'
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq "$TAG_PATTERN"; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the app version $version (run pnpm release, then push its tag)"
            exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev libxdo-dev \
            build-essential patchelf file xz-utils

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (the version comes from "packageManager" in package.json)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ env.RELEASE_BUILD == 'false' && 'pnpm' || '' }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.RELEASE_BUILD == 'false'
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cache the downloaded node archive
        if: env.RELEASE_BUILD == 'false'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/tagconn-desktop-cache/node-v*
          key: desktop-node-${{ env.NODE_VERSION }}-${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The node download must match the SHA-256 pinned in the script; every deployed package must be in pnpm-lock.yaml.
      - name: Assemble the app resources and the node sidecar
        shell: bash
        env:
          TAGCONN_DESKTOP_CACHE: ${{ runner.temp }}/tagconn-desktop-cache
          TARGET: ${{ matrix.target }}
        run: node scripts/build-desktop-resources.ts --target "$TARGET"

      - name: Verify the deployed node_modules against pnpm-lock.yaml
        shell: bash
        run: |
          for d in server runner; do
            node scripts/build-desktop-resources.ts --verify-deploy "apps/desktop/src-tauri/resources/$d/node_modules"
          done

      # Pre-build smoke (the W0e spike): the server from the assembled resources, with the DOWNLOADED node, in a
      # temp data dir on a random port: better-sqlite3 loads, /api/health answers, the web app index is served.
      - name: Smoke test the assembled resources
        shell: bash
        env:
          SIDECAR: ${{ matrix.sidecar }}
        run: |
          node scripts/smoke-desktop.ts server \
            --resources apps/desktop/src-tauri/resources \
            --node "apps/desktop/src-tauri/binaries/$SIDECAR"

      # No signing key here: updater artifacts are switched off and signed afterwards by the `sign` job.
      - name: Build the installers
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          # ONE merged config file: a second --config replaces the first instead of merging (that dropped
          # externalBin, so no tagconn-node was bundled). A file, not inline JSON: quoting through pnpm.cmd on Windows
          # is fragile.
          node -e "const f='apps/desktop/src-tauri/';const c=JSON.parse(require('fs').readFileSync(f+'tauri.bundle.conf.json','utf8'));c.bundle.createUpdaterArtifacts=false;require('fs').writeFileSync(f+'tauri.ci.conf.json',JSON.stringify(c,null,2))"
          pnpm --filter @tagconn/desktop tauri build --config src-tauri/tauri.ci.conf.json --bundles "$BUNDLES"

      # Post-build smoke on Windows: silently install the NSIS setup into a temp dir, then run the INSTALLED node +
      # supervisor headless with a scripted RPC (app.info, config.set, service.start server, health, service.stop),
      # and assert nothing of it is left running. The sidecar is installed as tagconn-node.exe next to the app.
      - name: Smoke test the installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no NSIS setup .exe was built' }
          $dir = Join-Path $env:RUNNER_TEMP 'tagconn-installed'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer exited with code $($p.ExitCode)" }
          $node = Join-Path $dir 'tagconn-node.exe'
          if (-not (Test-Path $node) -or -not (Test-Path (Join-Path $dir 'supervisor/supervisor.js'))) {
            Get-ChildItem $dir | Format-Table Name
            throw "the installed app is incomplete (tagconn-node.exe or supervisor/supervisor.js missing in $dir)"
          }
          node scripts/smoke-desktop.ts rpc --resources $dir --node $node
          if ($LASTEXITCODE -ne 0) { throw 'the installed-app RPC smoke failed' }
          Start-Sleep -Seconds 2
          $left = Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith($dir, [StringComparison]::OrdinalIgnoreCase) }
          if ($left) { $left | Format-Table Id, Path; throw 'processes of the installed app are still running' }

      # The same idea on Linux: unpack the .deb (no root needed) and drive the packaged node + supervisor. The package
      # must ship its node as /usr/bin/tagconn-node and never as /usr/bin/node (it would shadow or replace the system node).
      - name: Smoke test the packaged Linux app
        if: runner.os == 'Linux'
        run: |
          deb=$(ls apps/desktop/src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          dpkg-deb -c "$deb" > "$RUNNER_TEMP/deb-contents.txt"
          # dpkg-deb -c lists paths with or without a leading ./ depending on how the archive was built.
          if grep -Eq ' (\./)?usr/bin/node( -> .*)?$' "$RUNNER_TEMP/deb-contents.txt"; then
            echo "::error::the .deb contains /usr/bin/node"
            exit 1
          fi
          grep -Eq ' (\./)?usr/bin/tagconn-node$' "$RUNNER_TEMP/deb-contents.txt" || { echo "::error::the .deb has no /usr/bin/tagconn-node"; exit 1; }
          dpkg-deb -x "$deb" "$RUNNER_TEMP/tagconn-deb"
          node scripts/smoke-desktop.ts rpc \
            --resources "$RUNNER_TEMP/tagconn-deb/usr/lib/tagconn" \
            --node "$RUNNER_TEMP/tagconn-deb/usr/bin/tagconn-node"

      - name: Upload the installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb

  # Signs the updater artifacts (the Windows setup and the AppImage). The only job that sees the signing key, and only
  # in the environment of one step; it runs no project build scripts (pnpm install --ignore-scripts).
  sign:
    name: sign the updater artifacts
    needs: build
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @tagconn/desktop

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Sign the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set in the release environment: no .sig files, no latest.json."
            exit 0
          fi
          shopt -s nullglob
          files=(dist/*-setup.exe dist/*.AppImage)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::nothing to sign in dist"; exit 1; }
          for f in "${files[@]}"; do
            pnpm --filter @tagconn/desktop exec tauri signer sign "$PWD/$f"
            [ -s "$f.sig" ] || { echo "::error::$f.sig was not produced"; exit 1; }
          done

      - name: Upload the signatures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-signatures
          if-no-files-found: ignore
          path: dist/*.sig

  publish:
    name: publish to the release
    needs: sign
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create the draft release and upload assets
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Create latest.json and upload everything
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq "$TAG_PATTERN"; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
          # Never touch a published release: upload only to a draft, or create the draft.
          if is_draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::release $TAG is already published; refusing to upload to it (delete or un-publish it by hand first)"
              exit 1
            fi
          else
            gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "$TAG" \
              --notes "Desktop builds attached by CI. Edit the notes, then publish this draft."
          fi
          ls -l dist
          # The updater manifest: only when the builds were signed. Each platform points at its signed installer.
          node <<'JS'
          const fs = require('node:fs');
          const { TAG, REPO } = process.env;
          const files = fs.readdirSync('dist');
          const platforms = {};
          for (const [key, re] of [['windows-x86_64', /-setup\.exe$/], ['linux-x86_64', /\.AppImage$/]]) {
            const file = files.find((f) => re.test(f));
            if (!file || !files.includes(`${file}.sig`)) continue;
            platforms[key] = {
              signature: fs.readFileSync(`dist/${file}.sig`, 'utf8').trim(),
              url: `https://github.com/${REPO}/releases/download/${TAG}/${file}`,
            };
          }
          if (Object.keys(platforms).length === 0) {
            console.log('No .sig files: the builds are unsigned, skipping latest.json.');
          } else {
            const manifest = { version: TAG.replace(/^v/, ''), notes: `See https://github.com/${REPO}/releases/tag/${TAG}`, pub_date: new Date().toISOString(), platforms };
            fs.writeFileSync('dist/latest.json', JSON.stringify(manifest, null, 2) + '\n');
            console.log(`latest.json for ${Object.keys(platforms).join(', ')}`);
          }
          JS
          # --clobber only replaces assets of this DRAFT (a re-run of the workflow).
          # The artifacts download into one folder per bundle (appimage/, deb/, nsis/): upload the files, not the folders.
          mapfile -t files < <(find dist -type f | sort)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no files to upload"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber

  docker-image:
    name: server image (ghcr.io)
    # Docker mode of tagconn Desktop runs only this image (the web app is built into it). Tag pushes only, and only
    # after every desktop build and smoke test passed.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compute the image tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq "$TAG_PATTERN"; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
          version="${TAG#v}"
          image=ghcr.io/ilomon10/tagconn-server
          {
            echo 'list<<EOF'
            echo "$image:$version"
            # A pre-release (1.2.3-rc.1) never becomes :latest.
            case "$version" in *-*) ;; *) echo "$image:latest" ;; esac
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # No build cache: a release image is built from scratch.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/server.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
